<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yukta Chegu - Stakeholder Map</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* page-specific additions, kept separate from the main stylesheet */
  .map-wrap{padding:30px 0 10px;overflow-x:auto;}
  #map-svg{display:block;}
  .node-center circle{fill:var(--ink);}
  .node-center text{fill:var(--paper);font-size:13px;font-weight:700;}
  .node-cat circle{fill:var(--paper);stroke:var(--blue);stroke-width:2px;}
  .node-cat text{fill:var(--blue);font-size:12px;font-weight:700;}
  .node-person circle{fill:var(--ochre);stroke:var(--paper);stroke-width:1.5px;}
  .node-person text{fill:var(--ink);font-size:10.5px;}
  .link{stroke:var(--line);stroke-width:1px;}
  .node-person{cursor:default;}
  .node-person:hover circle{fill:var(--blue);}
  .legend{padding:0 0 50px;}
  .legend h3{font-size:1rem;margin-bottom:10px;}
  .legend-list{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--ink-soft);font-size:.92rem;}
  .add-note{
    background:var(--paper-deep);
    border:1px solid var(--line);
    padding:18px 20px;
    margin:0 0 40px;
    font-size:.92rem;
    color:var(--ink-soft);
  }
  .add-note code{background:#fff;padding:2px 5px;border:1px solid var(--line);font-size:.85em;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="wordmark" href="index.html">Yukta Chegu</a>
    <nav class="main">
      <a href="about.html">Me</a>

      <a href="stakeholders.html" class="active">Network</a>

    <div class="socials">
      <a href="https://uk.linkedin.com/in/yuktachegu" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://linktr.ee/yuktachegu" target="_blank" rel="noopener">Articles</a>

    </div>
  </div>
</header>

<section class="project-hero">
  <div class="wrap">
    <h1>Stakeholder Map</h1>
    <p class="sub">A growing network of people and organisations connected to Rubble Futures.</p>
  </div>
</section>

<section class="wrap">

   
  <div class="map-wrap">
    <svg id="map-svg" viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="legend">
<div style="height:70px;"></div>
    <h3>By category</h3>
    <div class="legend-list" id="legend-list"></div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <span>© 2026 Yukta Chegu</span>
    <span><a href="https://uk.linkedin.com/in/yuktachegu" target="_blank" rel="noopener">LinkedIn</a> · <a href="https://linktr.ee/yuktachegu" target="_blank" rel="noopener">Articles</a></span>
  </div>
</footer>

<script>
/* ============================================================
   EDIT BELOW: add one line per person/organisation.
   Fields: name (required), type (required - the stakeholder
   category), note (optional short description).
   ============================================================ */
const stakeholders = [
  { name: "Saahas", type: "NGOs", note: "Waste-management projects pan-India" },
  { name: "Prof. Monto Mani", type: "Academics", note: "PV panels reuse, CST, IISC" },
  { name: "Biome BUILD", type: "Projects", note: "Climate-tech company reusing agricultural waste" },
  { name: "Dr. Salaimanimagudam", type: "Academics", note: "3D printing research, CST, IISC" },
  { name: "Alexander Dhesi", type: "Academics", note: "Construction salvage material scientist" },
  { name: "Maxence Grangeot", type: "Academics", note: "Researcher, Structural Xploration Lab, EPFL" },
  { name: "Will Arnold", type: "Practitioner", note: "Author of Future Build" },
  { name: "Mitakshi Sirsi", type: "Practitioner", note: "Director of Sustainability" },
  { name: "Scott Brookes", type: "Practitioner", note: "Director of Projects at Article 25" },
  { name: "Studio ArkHIVES", type: "Architects", note: "Driving waste reuse in real projects" },
  { name: "Malba Project", type: "Projects", note: "Using technology to collect, manage, and recycle debris" },
  { name: "Mrinmayee Consultants", type: "Consultants", note: "Developing and disseminating alternative technologies in building construction" },
];
/* ============================================================
   Nothing below this line needs editing.
   ============================================================ */

const svg = document.getElementById("map-svg");
const legendList = document.getElementById("legend-list");
const W = 1000, H = 760;
const CX = W / 2, CY = H / 2 - 20;

// group people by category, in order of first appearance
const categories = [];
const byCategory = {};
stakeholders.forEach(p => {
  if (!byCategory[p.type]) { byCategory[p.type] = []; categories.push(p.type); }
  byCategory[p.type].push(p);
});

const catRadius = 220;
const personRadius = 360;
const catAngleStep = (2 * Math.PI) / Math.max(categories.length, 1);

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// shortens a line by padStart/padEnd (in px) along its own direction,
// so it stops at the edge of a shape instead of running through its center
function trimLine(x1, y1, x2, y2, padStart, padEnd) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const ux = dx / len, uy = dy / len;
  return {
    x1: x1 + ux * padStart, y1: y1 + uy * padStart,
    x2: x2 - ux * padEnd,   y2: y2 - uy * padEnd
  };
}

// center node
svg.appendChild(svgEl("g", {class:"node-center"})).append(
  svgEl("circle", {cx:CX, cy:CY, r:46}),
  svgEl("text", {x:CX, y:CY-4, "text-anchor":"middle"})
);
svg.querySelector(".node-center text").textContent = "Rubble";
const centerText2 = svgEl("text", {x:CX, y:CY+14, "text-anchor":"middle", fill:"var(--paper)", "font-size":"13", "font-weight":"700"});
centerText2.textContent = "Futures";
svg.querySelector(".node-center").appendChild(centerText2);

const linksLayer = svgEl("g", {class:"links-layer"});
const nodesLayer = svgEl("g", {class:"nodes-layer"});
svg.appendChild(linksLayer);
svg.appendChild(nodesLayer);

categories.forEach((cat, i) => {
  const angle = i * catAngleStep - Math.PI / 2;
  const catX = CX + catRadius * Math.cos(angle);
  const catY = CY + catRadius * Math.sin(angle) * 0.82;

  const catW = Math.max(70, cat.length * 7.5);
  const catPad = catW / 2 + 6;

  // line from center to category, trimmed to stop at each shape's edge
  const l1 = trimLine(CX, CY, catX, catY, 50, catPad);
  linksLayer.appendChild(svgEl("line", {class:"link", x1:l1.x1, y1:l1.y1, x2:l1.x2, y2:l1.y2}));

  const g = svgEl("g", {class:"node-cat"});
  g.appendChild(svgEl("rect", {x:catX - catW/2, y:catY-16, width:catW, height:32, rx:16, fill:"var(--paper)", stroke:"var(--blue)", "stroke-width":"2"}));
  const catLabel = svgEl("text", {x:catX, y:catY+4, "text-anchor":"middle"});
  catLabel.textContent = cat;
  g.appendChild(catLabel);
  nodesLayer.appendChild(g);

  const people = byCategory[cat];
  const spread = Math.min(catAngleStep * 0.85, 0.4 * people.length);
  const peopleRadius = personRadius + Math.max(0, people.length - 3) * 40;
  people.forEach((p, j) => {
    const pAngle = angle - spread/2 + (people.length > 1 ? (spread * j / (people.length - 1)) : spread/2);
    const px = CX + peopleRadius * Math.cos(pAngle);
    const py = CY + peopleRadius * Math.sin(pAngle) * 0.82;

    const l2 = trimLine(catX, catY, px, py, catPad, 11);
    linksLayer.appendChild(svgEl("line", {class:"link", x1:l2.x1, y1:l2.y1, x2:l2.x2, y2:l2.y2}));

    const pg = svgEl("g", {class:"node-person"});
    const title = svgEl("title", {});
    title.textContent = p.note ? `${p.name} - ${p.note}` : p.name;
    pg.appendChild(title);
    pg.appendChild(svgEl("circle", {cx:px, cy:py, r:7}));

    const anchorStart = Math.cos(pAngle) >= 0; const longest = Math.max(p.name.length, (p.note||"").length * 0.85); const labelW = longest * 6.4 + 8; const labelX = anchorStart ? px + 11 : px - 11; const boxH = p.note ? 32 : 16; pg.appendChild(svgEl("rect", { x: anchorStart ? labelX - 4 : labelX - labelW + 4, y: py - 10, width: labelW, height: boxH, fill: "var(--paper)" })); const label = svgEl("text", { x: labelX, y: py + 4, "text-anchor": anchorStart ? "start" : "end" }); label.textContent = p.name; pg.appendChild(label); if (p.note) { const noteLabel = svgEl("text", { x: labelX, y: py + 18, "text-anchor": anchorStart ? "start" : "end", fill: "var(--ink-soft)", "font-size": "9" }); noteLabel.textContent = p.note; pg.appendChild(noteLabel); } nodesLayer.appendChild(pg);
  });
});

const bbox = svg.getBBox(); const pad = 30; svg.setAttribute("viewBox", `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + pad*2} ${bbox.height + pad*2}`);

svg.setAttribute("width", bbox.width + pad*2); svg.setAttribute("height", bbox.height + pad*2); 

// legend
categories.forEach(cat => {
  const span = document.createElement("span");
  span.innerHTML = `<strong style="color:var(--blue)">${cat}</strong> (${byCategory[cat].length})`;
  legendList.appendChild(span);
});
</script>

</body>
</html>
